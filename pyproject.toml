[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vital"
version = "1.0.0"
description = "Vessel Integrated Turbine Assessment for LCOE"
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
license-files = [
    "LICENSE.md",
    "COPYRIGHT.md",
    "LICENSE/*.txt",
]
authors = [
    { name = "Sandia National Laboratories" },
]
urls = {
    Documentation = "https://sandialabs.github.io/VITAL/",
    Repository = "https://github.com/sandialabs/VITAL",
}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "matplotlib",
    "pandas",
    "scipy",
    "seaborn",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "sphinx",
    "sphinx-autobuild",
    "sphinx-rtd-theme",
    "jupyter",
    "nbsphinx",
]

docs = [
    "sphinx",
    "sphinx-autobuild",
    "sphinx-rtd-theme",
    "nbsphinx",
    "jupyter",
]

visualization = [
    "matplotlib",
    "seaborn",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vital*"]